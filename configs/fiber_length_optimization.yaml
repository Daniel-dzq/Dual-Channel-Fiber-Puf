# Fiber-length optimization (Fig. 4, Supplementary Table S7) - raw-video mode.
# Paths are relative to the repository root. Extract raw_fiber_length.zip into
# data/raw/fiber_length/ so that data/raw/fiber_length/videos/*.mp4 and
# data/raw/fiber_length/dark/ exist (see docs/REPRODUCIBILITY.md).

experiment:
  name: fiber_length_optimization
  seed: 20260721
  strict_dataset: true
  allow_incomplete: false
  allow_missing_dark: false

dataset:
  expected_lengths_cm: [7, 9, 11, 13, 15]
  expected_fibers: [F01, F02, F03, F04, F05]
  expected_rounds: [A, B]
  expected_challenges: [C01, C02, C03, C04, C05, C06, C07, C08]
  challenge_macro_pixel: 2

paths:
  videos_dir: data/raw/fiber_length/videos
  dark_dir: data/raw/fiber_length/dark
  outputs_dir: outputs/fiber_length/runs
  dark_video: null
  dark_artifact: null

video:
  trim_start_s: 10.0
  trim_end_s: 10.0
  temporal_blocks: 3
  aggregation: median
  minimum_valid_frames_per_block: 3

channels:
  green_video_channel: G
  red_video_channel: R
  compute_channel_dominance_qc: true

preprocessing:
  dark_correction: true
  use_global_valid_mask: true
  detail_sigma_px: 42.0
  detail_epsilon: 1.0
  green_common_mode: true
  red_common_mode: false
  # Round-specific (screening) common-component estimation; see Supplementary Table S5.
  common_mode_grouping:
    - length_cm
    - fiber_id
    - round
    - temporal_block
  mask_abs_floor: 5.0
  mask_percentile: 10.0

quality_control:
  saturation_fraction_threshold: 0.02
  acf_width_cap_px: 40.0
  minimum_valid_pixel_fraction: 0.50
  fail_on_resolution_mismatch: true

statistics:
  bootstrap_iterations: 5000
  confidence_level: 0.95
  cluster_by_device: true
  resample_challenges_within_device: true
  bootstrap_iterations_smoke: 200

length_selection:
  criterion: maximin_robust_gap
  use_red_as_guardrail: true
  never_force_unique_optimum: true
  prefer_shorter_length_inside_plateau: true
  plateau_ci_overlap: true
  selection_prob_unique_min: 0.60

plotting:
  font_family: DejaVu Sans
  dpi: 300
  save_png: true
  save_pdf: false
  save_svg: false
  add_panel_labels: true
  add_figure_titles: false
  skip_figures: true

acquisition:
  sequence_assignment:
    F01: P1
    F02: P2
    F03: P3
    F04: P4
    F05: P5
  challenge_sequences:
    P1: [C01, C02, C03, C04, C05, C06, C07, C08]
    P2: [C03, C04, C05, C06, C07, C08, C01, C02]
    P3: [C05, C06, C07, C08, C01, C02, C03, C04]
    P4: [C07, C08, C01, C02, C03, C04, C05, C06]
    P5: [C02, C04, C06, C08, C01, C03, C05, C07]
  same_sequence_in_round_a_and_b: true
  infer_order_from_file_timestamp: false
  infer_order_from_directory_listing: false

runtime:
  n_workers: 1
  cache_templates: true
