[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-channel-fiber-puf"
version = "1.0.0"
description = "Analysis code for 'Dual-channel fiber physical unclonable functions with persistent identity and reconfigurable credentials'"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ziqi Dai" }, { name = "Yaxin Zhang" }, { name = "Lu Kang" }, { name = "Chuanbo Li" },
  { name = "Honglian Guo" }, { name = "Min Lv" }, { name = "Xin Tang" },
]
keywords = ["physical unclonable function", "optical fiber", "speckle", "authentication", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "opencv-python>=4.9",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "tqdm>=4.65",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "pyarrow>=15.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
video = ["av>=12.0"]

[project.urls]
Dataset = "https://doi.org/10.5281/zenodo.22267156"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]
